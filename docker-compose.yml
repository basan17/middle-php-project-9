version: '3.8'

services:
  # Наше Slim-приложение
  web:
    build: .
    container_name: slim_app
    restart: unless-stopped
    # Больше не пробрасываем порт 8000 наружу, приложение будет доступно внутри сети Docker
    expose:
      - "8000"
    volumes:
      - slim_data:/var/www/database

  # Обратный прокси для домена и SSL
  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx_proxy_manager
    restart: unless-stopped
    ports:
      - '80:80'   # HTTP трафик
      - '443:443' # HTTPS трафик
      - '81:81'   # Панель управления прокси
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

volumes:
  slim_data:
